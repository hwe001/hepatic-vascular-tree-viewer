<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Post-resection hepatic-artery flow: segments II, III and IV</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#f7f8fa;font:14px Arial,sans-serif;color:#17202a}
    #view{display:block;width:100%;height:100%}
    #panel{position:fixed;left:14px;top:14px;width:min(390px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:rgba(255,255,255,.94);border-radius:12px;padding:14px 16px;box-shadow:0 3px 18px #0002;line-height:1.35}
    h1{font-size:20px;margin:0 0 7px}h2{font-size:15px;margin:13px 0 5px;border-top:1px solid #d8dee5;padding-top:9px}
    .note{font-size:12px;color:#55616d}.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row label{flex:1}.row input[type=number]{width:78px}.row input[type=range]{flex:1}
    button{border:0;border-radius:6px;background:#2d6cdf;color:white;padding:7px 11px;cursor:pointer}button.secondary{background:#64748b}
    #metrics{background:#eef5ff;border-left:4px solid #2d6cdf;padding:8px;margin-top:8px;font-size:13px}.metric{display:flex;justify-content:space-between;gap:12px}.metric b{font-variant-numeric:tabular-nums}
    #legend{margin-top:8px;font-size:12px}.bar{height:11px;border-radius:6px;background:linear-gradient(90deg,#1646d8,#00b9df,#16b85a,#ffd000,#e82222);margin:3px 0}
    #status{font-size:12px;color:#475569;margin-top:8px}.warn{color:#8a4b08}
  </style>
</head>
<body>
<canvas id="view"></canvas>
<section id="panel">
  <h1>HA territory sanity check</h1>
  <div class="note">Audit the intact tree first, then switch to the post-resection remnant. Z2/Z3/Z4 are exploratory portal-zone assignments used as a spatial proxy for segments II/III/IV.</div>
  <div class="row"><label>Viewer mode</label><select id="mode"><option value="audit">Intact tree: highlight Z2 + Z3 + Z4</option><option value="test">Daughter test: remove child 216</option><option value="deep">Deeper test: remove child 990 at node 10</option><option value="candidate">Flag alternate trunk: child 342 at node 276</option><option value="upstream">Upstream cut: remove child 228 at node 160</option><option value="post">Right hepatectomy: remove yellow/orange branch</option></select></div>
  <h2>Scenario inputs</h2>
  <div class="row"><label>Total portal flow (mL/min)</label><input id="pv" type="number" min="1" value="800" step="10"></div>
  <div class="row"><label>Intact HA mean (mL/min)</label><input id="intact" type="number" min="1" value="250" step="5"></div>
  <div class="row"><label>Post-resection HABR HA mean (mL/min)</label><input id="post" type="number" min="1" value="150" step="5"></div>
  <div class="row"><label>Pulse amplitude</label><input id="amp" type="range" min="0" max="0.5" value="0.25" step="0.01"><output id="ampOut">25%</output></div>
  <div class="row"><label>Time in cardiac cycle</label><input id="time" type="range" min="0" max="1" value="0" step="0.002"><output id="timeOut">0.00 s</output></div>
  <div class="row"><button id="play">Play waveform</button><button class="secondary" id="fit">Fit view</button></div>
  <div id="metrics"></div>
  <div id="legend"><b id="legendTitle">Highlighted supply paths</b><div class="bar"></div><span id="legendText"></span></div>
  <div id="status"></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/three@0.84.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const canvas=document.getElementById('view'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf7f8fa,1);
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,1,.1,10000);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=true;controls.screenSpacePanning=true;
  controls.mouseButtons={ORBIT:THREE.MOUSE.LEFT,ZOOM:THREE.MOUSE.MIDDLE,PAN:THREE.MOUSE.RIGHT};
  scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.5));const key=new THREE.DirectionalLight(0xffffff,1.8);key.position.set(1,2,3);scene.add(key);
  const group=new THREE.Group();scene.add(group);let data,centers=[],nodeById={},zoneByNode={},retainedEdges=[],auditEdges=[],testEdges=[],deepTestEdges=[],upstreamTestEdges=[],candidateEdges=[],candidateSide=new Set(),candidateOtherSide=new Set(),auditTarget=new Set(),retainedTerminals=[],auditTerminals=[],allTerminals=[],splitNode=null,removedChild=null,trunkEdges=new Set(),daughterAEdges=new Set(),daughterBEdges=new Set(),edgeMean=new Map(),edgeMeshes=[],playing=false,last=performance.now();
  const $=id=>document.getElementById(id), zones=[2,3,4], RED=0xe23b2f;
  function centerFromZone(z){const v=z.vertices,n=v.length/3,c=new THREE.Vector3();for(let i=0;i<v.length;i+=3)c.add(new THREE.Vector3(v[i],v[i+1],v[i+2]));return c.multiplyScalar(1/n)}
  function nearestZone(p){let best=0,d=Infinity;centers.forEach((c,i)=>{const x=p.distanceToSquared(c);if(x<d){d=x;best=i+1}});return best}
  function classify(){zoneByNode={};Object.values(nodeById).forEach(n=>zoneByNode[n.id]=nearestZone(new THREE.Vector3(...n.p)))}
  function topology(){const children={},parents={};Object.keys(nodeById).forEach(id=>{children[id]=[];parents[id]=[]});data.edges.forEach(e=>{if(children[e.a])children[e.a].push(e);if(parents[e.b])parents[e.b].push(e.a)});allTerminals=Object.keys(children).map(Number).filter(id=>children[id].length===0);
    const root=data.rootId==null?0:data.rootId,descendantNodes=start=>{const out=[],q=[start],seen=new Set();while(q.length){const id=q.pop();if(seen.has(id))continue;seen.add(id);out.push(+id);(children[id]||[]).forEach(e=>q.push(e.b))}return out},descendantTerminals=start=>descendantNodes(start).filter(id=>(children[id]||[]).length===0);
    auditTerminals=allTerminals.filter(id=>zones.includes(zoneByNode[id]));const auditNeed=new Set(auditTerminals),auditStack=auditTerminals.slice();while(auditStack.length){const id=auditStack.pop();(parents[id]||[]).forEach(p=>{if(!auditNeed.has(p)){auditNeed.add(p);auditStack.push(p)}})}const auditReach=new Set([root]),auditForward=[root];while(auditForward.length){const id=auditForward.pop();(children[id]||[]).forEach(e=>{if(auditNeed.has(e.b)&&!auditReach.has(e.b)){auditReach.add(e.b);auditForward.push(e.b)}})}auditEdges=data.edges.filter(e=>auditNeed.has(e.a)&&auditNeed.has(e.b)&&auditReach.has(e.a)&&auditReach.has(e.b));auditTarget=new Set(auditEdges);
    // The first true bifurcation after the inlet is the anatomical right/left
    // HA split. Select the child carrying the larger retained Z2/Z3/Z4
    // territory, and discard the sibling branch and every daughter below it.
    let split=root;while((children[split]||[]).length===1)split=children[split][0].b;splitNode=split;const splitChildren=children[split]||[];trunkEdges=new Set();let trunkCursor=root;while(trunkCursor!==split&&(children[trunkCursor]||[]).length===1){const trunkEdge=children[trunkCursor][0];trunkEdges.add(trunkEdge);trunkCursor=trunkEdge.b}const sideA=new Set(splitChildren.length?descendantNodes(splitChildren[0].b):[]),sideB=new Set(splitChildren.length>1?descendantNodes(splitChildren[1].b):[]);daughterAEdges=new Set(data.edges.filter(e=>(sideA.has(e.a)&&sideA.has(e.b))||(e.a===split&&sideA.has(e.b))));daughterBEdges=new Set(data.edges.filter(e=>(sideB.has(e.a)&&sideB.has(e.b))||(e.a===split&&sideB.has(e.b))));const retainedScore=e=>descendantTerminals(e.b).filter(id=>zones.includes(zoneByNode[id])).length,keepChild=splitChildren.length?splitChildren.slice().sort((a,b)=>retainedScore(b)-retainedScore(a))[0].b:null,keepSide=new Set(keepChild==null?[]:descendantNodes(keepChild));removedChild=splitChildren.map(e=>e.b).find(id=>id!==keepChild)||null;const removedSide=new Set(removedChild==null?[]:descendantNodes(removedChild));testEdges=data.edges.filter(e=>!removedSide.has(e.a)&&!removedSide.has(e.b));candidateSide=new Set(descendantNodes(342));candidateOtherSide=new Set();candidateEdges=testEdges.slice();const deepSide=new Set(descendantNodes(990));deepTestEdges=data.edges.filter(e=>!deepSide.has(e.a)&&!deepSide.has(e.b));const upstreamSide=new Set(descendantNodes(228));upstreamTestEdges=data.edges.filter(e=>!upstreamSide.has(e.a)&&!upstreamSide.has(e.b));
    retainedTerminals=allTerminals.filter(id=>zones.includes(zoneByNode[id])&&keepSide.has(id));const need=new Set(retainedTerminals),stack=retainedTerminals.slice();while(stack.length){const id=stack.pop();(parents[id]||[]).forEach(p=>{if(!need.has(p)){need.add(p);stack.push(p)}})}
    // First collect ancestors, then walk forward from node 0. The split rule
    // above is applied to every edge below the selected bifurcation.
    const allowed=new Set(keepSide);let upstream=split;while(upstream!==root){allowed.add(upstream);upstream=(parents[upstream]||[])[0];if(upstream==null)break}allowed.add(root);const reachable=new Set([root]),forward=[root];while(forward.length){const id=forward.pop();(children[id]||[]).forEach(e=>{if(allowed.has(e.b)&&need.has(e.b)&&!reachable.has(e.b)){reachable.add(e.b);forward.push(e.b)}})}
    retainedEdges=data.edges.filter(e=>need.has(e.a)&&need.has(e.b)&&reachable.has(e.a)&&reachable.has(e.b));const leaves=new Set(retainedTerminals),retainedCounts={};function count(id){if(retainedCounts[id]!=null)return retainedCounts[id];const kids=(children[id]||[]).filter(e=>retainedEdges.includes(e));retainedCounts[id]=kids.length?kids.reduce((s,e)=>s+count(e.b),0):(leaves.has(+id)?1:0);return retainedCounts[id]}count(root);edgeMean=new Map();retainedEdges.forEach(e=>edgeMean.set(e,retainedCounts[e.b]||0));}
  function color(v,min,max){const t=Math.max(0,Math.min(1,(v-min)/Math.max(1e-9,max-min)));return new THREE.Color().setHSL((1-t)*.67,.9,.5)}
  function rebuild(){while(group.children.length)group.remove(group.children[0]);edgeMeshes=[];const post=+$('post').value||150,mode=$('mode').value,audit=mode==='audit',test=mode==='test',deep=mode==='deep',candidate=mode==='candidate',upstream=mode==='upstream',renderEdges=audit?data.edges:(test?testEdges:(deep?deepTestEdges:(candidate?candidateEdges:(upstream?upstreamTestEdges:retainedEdges))));renderEdges.forEach(e=>{const a=nodeById[e.a],b=nodeById[e.b],A=new THREE.Vector3(...a.p),B=new THREE.Vector3(...b.p),v=B.clone().sub(A),L=v.length();if(L<1e-6)return;const rootEdge=trunkEdges.has(e),daughterA=daughterAEdges.has(e),daughterB=daughterBEdges.has(e),candidateEdge=candidate&&candidateSide.has(e.a)&&candidateSide.has(e.b),otherCandidateEdge=candidate&&candidateOtherSide.has(e.a)&&candidateOtherSide.has(e.b),radius=Math.max(.07,(+e.radius||.18)*3.0),geo=new THREE.CylinderGeometry(radius,radius,L,7,1,false),mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:rootEdge?0xd62728:candidateEdge?0x9b5de5:otherCandidateEdge?0x00a6a6:daughterA?0x198754:daughterB?0xf08c00:audit?(auditTarget.has(e)?0x1677d2:0xb8c0ca):test?0x315b8a:deep?0x7b4ab8:upstream?0x9b5de5:RED,transparent:true,opacity:rootEdge||daughterA||daughterB||candidateEdge||otherCandidateEdge?1:audit?(auditTarget.has(e)?.96:.28):.92,side:THREE.DoubleSide}));mesh.position.copy(A.clone().add(B).multiplyScalar(.5));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());mesh.renderOrder=5;group.add(mesh);edgeMeshes.push({mesh,e})});const root=nodeById[data.rootId==null?0:data.rootId];if(root){const sphere=new THREE.Mesh(new THREE.SphereGeometry(2.2,16,10),new THREE.MeshPhongMaterial({color:0xd62728}));sphere.position.set(...root.p);group.add(sphere)};fit();update();}
  function update(){const intact=+$('intact').value||250,pv=+$('pv').value||800,post=+$('post').value||150,amp=+$('amp').value||0,t=+$('time').value||0,pre=intact*retainedTerminals.length/allTerminals.length,phase=2*Math.PI*1.2*t,qRoot=post*(1+amp*Math.sin(phase)),mode=$('mode').value,audit=mode==='audit',test=mode==='test'||mode==='deep'||mode==='upstream'||mode==='candidate',branchNode=mode==='deep'||mode==='candidate'?10:mode==='upstream'?160:splitNode,branchChild=mode==='deep'||mode==='candidate'?990:mode==='upstream'?228:removedChild;const leafQ=qRoot/Math.max(1,retainedTerminals.length);edgeMeshes.forEach(({mesh,e})=>{if(!audit&&!test&&!trunkEdges.has(e)&&!daughterAEdges.has(e)&&!daughterBEdges.has(e)){const q=(edgeMean.get(e)||0)*leafQ;mesh.material=new THREE.MeshPhongMaterial({color:color(q,0,qRoot),transparent:true,opacity:.94,side:THREE.DoubleSide})}});$('ampOut').value=Math.round(amp*100)+'%';$('timeOut').value=t.toFixed(2)+' s';$('metrics').innerHTML=audit?'<div class="metric"><span>Complete intact HA terminals</span><b>'+allTerminals.length+'</b></div><div class="metric"><span>Highlighted Z2+Z3+Z4 terminals</span><b>'+auditTerminals.length+'</b></div><div class="metric"><span>Highlighted supply edges</span><b>'+auditEdges.length+'</b></div>':test?'<div class="metric"><span>Test bifurcation node</span><b>'+branchNode+'</b></div><div class="metric"><span>Candidate/removed daughter</span><b>'+branchChild+'</b></div><div class="metric"><span>Visible edges after test</span><b>'+(mode==='deep'?deepTestEdges.length:mode==='upstream'?upstreamTestEdges.length:mode==='candidate'?candidateEdges.length:testEdges.length)+'</b></div>':'<div class="metric"><span>Total portal flow</span><b>'+pv.toFixed(1)+' mL/min</b></div><div class="metric"><span>Intact remnant HA share</span><b>'+pre.toFixed(2)+' mL/min</b></div><div class="metric"><span>Post-resection HABR HA mean</span><b>'+post.toFixed(2)+' mL/min</b></div><div class="metric"><span>Current pulsatile HA root flow</span><b>'+qRoot.toFixed(2)+' mL/min</b></div><div class="metric"><span>Retained terminal sites</span><b>'+retainedTerminals.length+' / '+allTerminals.length+'</b></div>';$('legendTitle').textContent=audit?'Red: root trunk · green/orange: daughter territories · blue/grey: Z2/Z3/Z4 audit':mode==='candidate'?'Purple: substantial child 990 spillover subtree · green: retained HA tree':test?'Red root trunk · green/orange daughter territories':'HA flow per retained segment';$('legendText').textContent=audit?'Intact tree shown without resection':mode==='candidate'?'Candidate child 990 remains visible for confirmation':test?'Removed child '+branchChild+' and all daughters':'0 to '+qRoot.toFixed(2)+' mL/min';$('status').innerHTML=audit?'<span class="warn">Sanity-check mode:</span> red marks the root HA through the unary trunk to the first bifurcation; green and orange mark its two daughter territories. Blue paths are the Z2/Z3/Z4 audit overlay.':mode==='candidate'?'<span class="warn">Candidate review:</span> purple marks substantial child 990 at node 10 and its downstream subtree. Nothing in the candidate subtree has been removed yet.':test?'<span class="warn">Branch test:</span> node '+branchNode+' has one daughter subtree removed: child '+branchChild+' and all downstream vessels are hidden; all other HA branches remain visible.':'<span class="warn">Scenario interpretation:</span> post-HABR HA is '+(post<pv?'below':'not below')+' total portal flow and '+(post>pre?'above':'not above')+' the intact Z2+Z3+Z4 HA share. Zone assignment is nearest-centroid exploratory anatomy, not a validated Couinaud map.';}
  function fit(){const box=new THREE.Box3().setFromObject(group),size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),r=Math.max(size.x,size.y,size.z)*.5||1;camera.position.copy(c).add(new THREE.Vector3(r*1.7,r*1.25,r*2.3));camera.near=Math.max(r/1000,.01);camera.far=Math.max(r*20,100);camera.updateProjectionMatrix();controls.target.copy(c);controls.update()}
  function labelAlternateCandidate(){if($('mode').value!=='candidate')return;$('metrics').innerHTML='<div class="metric"><span>Candidate bifurcation node</span><b>276</b></div><div class="metric"><span>Highlighted alternate trunk</span><b>342</b></div><div class="metric"><span>Candidate terminal sites</span><b>297</b></div>';$('legendTitle').textContent='Teal: child 342 · green: retained child 990';$('legendText').textContent='Candidate child 342 remains visible for confirmation';$('status').innerHTML='<span class="warn">Candidate review:</span> teal marks child 342 at node 276 and its downstream subtree. The green child-990 subtree is retained; neither side has been removed.'}
  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
  ['pv','intact','post','amp'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='post')rebuild();else update()}));$('mode').onchange=()=>{rebuild();labelAlternateCandidate()};$('time').addEventListener('input',update);$('fit').onclick=fit;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause waveform':'Play waveform'};
  Promise.all([fetch('../cco/data/cco_arterial15_repaired.json?v=ha-remnant-1').then(r=>r.json()),fetch('../data/portal_zones_volume.json?v=zones-remnant-1').then(r=>r.json())]).then(([d,z])=>{data=d;(data.nodes||[]).forEach(n=>nodeById[n.id]=n);centers=z.zones.map(centerFromZone);classify();topology();const requestedMode=new URLSearchParams(location.search).get('mode');if(['audit','test','deep','candidate','upstream','post'].includes(requestedMode))$('mode').value=requestedMode;rebuild();labelAlternateCandidate();$('status').insertAdjacentHTML('afterbegin','<b>Loaded repaired HA tree and portal-zone assignments.</b><br>');}).catch(e=>{$('status').textContent='Could not load repaired HA tree or portal-zone geometry.';console.error(e)});
  function animate(now){requestAnimationFrame(animate);const dt=(now-last)/1000;last=now;if(playing){$('time').value=(+$('time').value+dt)%1;update()}controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
})();
</script>
</body>
</html>
