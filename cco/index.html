<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCO-style portal-tree growth prototype</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#f7f8fa}#view{width:100%;height:100%;display:block}#panel{position:fixed;top:14px;left:14px;z-index:2;width:310px;padding:14px 16px;color:#17202a;background:rgba(255,255,255,.96);border:1px solid #d6dbe1;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}h1{font-size:16px;margin:0 0 10px}label{display:block;margin:8px 0;font-size:13px}button{margin:5px 5px 0 0;padding:6px 9px;border:1px solid #c5ccd4;border-radius:6px;background:#fff;cursor:pointer}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}#hint,#status{margin-top:8px;font-size:11px;color:#68727c;line-height:1.35}
  </style>
</head>
<body>
  <div id="panel"><h1>CCO-style portal-tree growth</h1>
    <label><input id="showPortal" type="checkbox" checked> <span class="swatch" style="background:#2878b5"></span>Existing portal scaffold</label>
    <label><input id="showGrowth" type="checkbox" checked> <span class="swatch" style="background:#e67e22"></span>Synthetic CCO-style extension</label>
    <label><input id="showSurface" type="checkbox" checked> <span class="swatch" style="background:#d9a441"></span>Liver surface reference</label>
    <button id="fit">Fit view</button><button id="wire">Surface wireframe</button>
    <div id="hint">Rotate: left-drag · Pan: right-drag · Zoom: wheel/middle-drag</div>
    <div id="status">Loading growth prototype...</div>
  </div>
  <canvas id="view"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/loaders/JSONLoader.js"></script>
  <script>
    const canvas=document.getElementById('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf7f8fa,1);
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,10000),controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=true;controls.screenSpacePanning=true;controls.mouseButtons={ORBIT:THREE.MOUSE.LEFT,ZOOM:THREE.MOUSE.MIDDLE,PAN:THREE.MOUSE.RIGHT};
    scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.6));const key=new THREE.DirectionalLight(0xffffff,1.8);key.position.set(1,2,3);scene.add(key);const group=new THREE.Group();scene.add(group);const loader=new THREE.JSONLoader();let portal,growth,surface,surfaceMaterial,wire=false;
    function load(url){return new Promise((resolve,reject)=>loader.load(url,g=>resolve(g),undefined,reject))}function loadJson(url){return fetch(url).then(r=>r.json())}
    function cylinder(a,b,r,material){const d=new THREE.Vector3().subVectors(b,a),length=d.length(),mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,length,8,1,false),material);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return mesh}
    function renderGrowth(data){const scaffoldMaterial=new THREE.MeshPhongMaterial({color:0x5dade2,shininess:50}),grownMaterial=new THREE.MeshPhongMaterial({color:0xe67e22,shininess:50});growth=new THREE.Group();data.segments.forEach(s=>{const mesh=cylinder(new THREE.Vector3().fromArray(s.a),new THREE.Vector3().fromArray(s.b),s.radius||.18,s.kind==='grown'?grownMaterial:scaffoldMaterial);growth.add(mesh)});group.add(growth)}
    function fit(){const box=new THREE.Box3().setFromObject(group),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),r=Math.max(size.x,size.y,size.z)*.5||1;camera.position.copy(center).add(new THREE.Vector3(r*1.7,r*1.25,r*2.3));camera.near=Math.max(r/1000,.01);camera.far=Math.max(r*20,100);camera.updateProjectionMatrix();controls.target.copy(center);controls.update()}
    document.getElementById('showPortal').onchange=e=>portal.visible=e.target.checked;document.getElementById('showGrowth').onchange=e=>growth.visible=e.target.checked;document.getElementById('showSurface').onchange=e=>surface.visible=e.target.checked;document.getElementById('fit').onclick=fit;document.getElementById('wire').onclick=e=>{wire=!wire;surfaceMaterial.wireframe=wire;e.target.textContent=wire?'Solid surface':'Surface wireframe'};
    Promise.all([load('../data/libzinc-json/portal15_1.json'),load('../data/libzinc-json/surface15_1.json'),loadJson('../data/cco_portal_growth.json')]).then(gs=>{const pg=gs[0],sg=gs[1],data=gs[2];pg.computeBoundingBox();sg.computeBoundingBox();portal=new THREE.Mesh(pg,new THREE.MeshPhongMaterial({color:0x2878b5,side:THREE.DoubleSide,shininess:70}));group.add(portal);surfaceMaterial=new THREE.MeshPhongMaterial({color:0xd9a441,transparent:true,opacity:.08,side:THREE.DoubleSide,depthWrite:false});surface=new THREE.Mesh(sg,surfaceMaterial);group.add(surface);renderGrowth(data);fit();document.getElementById('status').textContent='Loaded '+data.scaffold_nodes+' scaffold nodes, '+data.grown_terminals+' terminals across '+data.growth_generations+' growth generations. Visualization only.'}).catch(e=>{console.error(e);document.getElementById('status').textContent='Load failed. Serve the repository over HTTP.'});
    function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
  </script>
</body>
</html>
