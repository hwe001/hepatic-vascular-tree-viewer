<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal CCO hepatectomy scenarios</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#f7f8fa}
    #view{width:100%;height:100%;display:block}
    #panel{position:fixed;top:14px;left:14px;z-index:2;width:310px;padding:14px 16px;color:#17202a;background:rgba(255,255,255,.96);border:1px solid #d6dbe1;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
    h1{font-size:16px;margin:0 0 10px}label{display:block;margin:8px 0;font-size:13px}input[type=range]{width:115px;vertical-align:middle}button{margin:5px 5px 0 0;padding:6px 9px;border:1px solid #c5ccd4;border-radius:6px;background:white;cursor:pointer}#hint,#status,#meta{margin-top:8px;font-size:11px;color:#68727c;line-height:1.35}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  </style>
</head>
<body>
  <div id="panel">
    <h1>Portal CCO hepatectomy scenarios</h1>
    <input id="file" type="file" accept=".json,application/json">
    <label><input id="showSurface" type="checkbox" checked> <span class="swatch" style="background:#d9a441"></span>Liver surface reference</label>
    <label><input id="showNodes" type="checkbox"> Show nodes</label>
    <label>Tree opacity <input id="treeOpacity" type="range" min="0.25" max="1" step="0.05" value="0.95"> <output id="treeOpacityValue">0.95</output></label>
    <label>Radius scale <input id="radiusScale" type="range" min="1" max="8" step="0.25" value="3"> <output id="radiusScaleValue">3x</output></label>
    <label>Scenario <select id="scenario"><option value="intact">Intact liver</option><option value="right">Standard right hepatectomy: remove V-VIII</option></select></label>
    <label><input id="hideResected" type="checkbox"> Hide branches assigned to resected zones</label>
    <label><input id="hideResectedSurface" type="checkbox" checked> Hide resected liver surface</label>
    <label><input id="showZones" type="checkbox" checked> Show exploratory portal zones</label>
    <div id="zoneStatus" style="font-size:11px;color:#68727c;line-height:1.35">Exploratory portal-perfusion zones; not validated clinical Couinaud segmentation.</div>
    <button id="fit">Fit view</button><button id="wire">Surface wireframe</button>
    <div id="meta">Geometry scenario viewer. Flow and pressure are not re-solved here.</div>
    <div id="hint">Rotate: left-drag · Pan: right-drag · Zoom: wheel/middle-drag</div>
    <div id="status">Loading the portal15-seeded CCO tree...</div>
  </div>
  <canvas id="view"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/loaders/JSONLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/loaders/STLLoader.js"></script>
  <script>
    const canvas=document.getElementById('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xf7f8fa,1);
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,10000),controls=new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;controls.enablePan=true;controls.screenSpacePanning=true;controls.mouseButtons={ORBIT:THREE.MOUSE.LEFT,ZOOM:THREE.MOUSE.MIDDLE,PAN:THREE.MOUSE.RIGHT};
    scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.6));const key=new THREE.DirectionalLight(0xffffff,1.8);key.position.set(1,2,3);scene.add(key);
    const group=new THREE.Group();scene.add(group);let treeGroup=null,nodesGroup=null,surface=null,surfaceMaterial=null,surfaceSource=null,zoneCenters=null,wire=false,currentData=null,zoneGroup=null,nodeZone={},nodeById={},virtualEdges=[],inflowNodes=new Set(),inflowEdges=new Set(),visibleEdges=new Set(),visibleNodes=new Set(),retainedStats={nodes:0,edges:0};
    const loader=new THREE.JSONLoader(),stlLoader=new THREE.STLLoader();
    function loadGeometry(url){return new Promise((resolve,reject)=>loader.load(url,g=>resolve(g),undefined,reject));}
    function loadSTL(url){return new Promise((resolve,reject)=>stlLoader.load(url,g=>resolve(g),undefined,reject));}
    function fit(){const box=new THREE.Box3().setFromObject(group),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),r=Math.max(size.x,size.y,size.z)*.5||1;camera.position.copy(center).add(new THREE.Vector3(r*1.7,r*1.25,r*2.3));camera.near=Math.max(r/1000,.01);camera.far=Math.max(r*20,100);camera.updateProjectionMatrix();controls.target.copy(center);controls.update()}
    function resected(){return document.getElementById('scenario').value==='right'?[5,6,7,8]:[]}
    function pointInResectedSide(p){const plane=surfaceResectionPlane();return !!plane&&p.clone().sub(plane.point).dot(plane.normal)>0}
    function retainedZone(id){const z=nodeZone[id];return document.getElementById('scenario').value==='right'&&z>=1&&z<=4}
    function edgeInResectedSide(e){const a=nodeById[e.a],b=nodeById[e.b];if(!a||!b||retainedZone(e.a)||retainedZone(e.b))return false;const pa=new THREE.Vector3(...a.p),pb=new THREE.Vector3(...b.p),mid=pa.clone().add(pb).multiplyScalar(.5);return pointInResectedSide(pa)||pointInResectedSide(pb)||pointInResectedSide(mid)}
    function edgeRemoved(e){return document.getElementById('hideResected').checked&&(!visibleEdges.has(e)||(!inflowEdges.has(e)&&edgeInResectedSide(e)))}
    function allEdges(data){return (data.edges||[]).concat(virtualEdges)}
    function buildContinuityEdges(data){const by={};(data.nodes||[]).forEach(n=>by[n.id]=n);const pairs=[[2,3],[4,5],[21,22],[34,35],[6,7],[14,15],[16,17]];virtualEdges=pairs.map(pair=>{const a=by[pair[0]],b=by[pair[1]];if(!a||!b)return null;return {a:a.id,b:b.id,scaffold:true,virtual:true,radius:Math.min(+a.radius||0.65,+b.radius||0.65)} }).filter(Boolean)}
    function rebuildRetainedTopology(data){
      visibleEdges=new Set();visibleNodes=new Set();
      const hide=document.getElementById('hideResected').checked,cut=new Set(resected()),byId={},adj={},scaffoldAdj={};nodeById={};inflowNodes=new Set();inflowEdges=new Set();
      (data.nodes||[]).forEach(n=>{byId[n.id]=n;nodeById[n.id]=n;adj[n.id]=[];scaffoldAdj[n.id]=[]});
      const edges=allEdges(data),rootId=data.rootId!=null?data.rootId:0,rootQueue=[];if(byId[rootId]){inflowNodes.add(rootId);rootQueue.push(rootId)}
      while(rootQueue.length){const id=rootQueue.shift();edges.forEach(e=>{if(!e.scaffold||e.virtual||(![e.a,e.b].includes(id)))return;const next=e.a===id?e.b:e.a;inflowEdges.add(e);if(!inflowNodes.has(next)){inflowNodes.add(next);rootQueue.push(next)}})}
      virtualEdges.filter(e=>inflowNodes.has(e.a)||inflowNodes.has(e.b)).forEach(e=>{
        inflowEdges.add(e);
        const bridgeEnd=inflowNodes.has(e.a)?e.b:e.a;inflowNodes.add(bridgeEnd);
        const candidates=edges.filter(x=>x.scaffold&&!x.virtual&&(x.a===bridgeEnd||x.b===bridgeEnd)).filter(x=>{const other=x.a===bridgeEnd?x.b:x.a;return !pointInResectedSide(new THREE.Vector3(...byId[other].p))});
        if(candidates.length){candidates.sort((x,y)=>{const xa=byId[x.a===bridgeEnd?x.b:x.a],xb=byId[y.a===bridgeEnd?y.b:y.a];return new THREE.Vector3(...xa.p).distanceTo(new THREE.Vector3(...byId[bridgeEnd].p))-new THREE.Vector3(...xb.p).distanceTo(new THREE.Vector3(...byId[bridgeEnd].p))});inflowEdges.add(candidates[0])}
      });
      const blocked=id=>hide&&!inflowNodes.has(id)&&!retainedZone(id)&&(cut.has(nodeZone[id])||pointInResectedSide(new THREE.Vector3(...byId[id].p)));
      edges.forEach(e=>{
        const keepInflow=inflowEdges.has(e);if((blocked(e.a)||blocked(e.b)||edgeInResectedSide(e))&&!keepInflow)return;
        adj[e.a].push([e.b,e]);adj[e.b].push([e.a,e]);
      });
      if(!hide){(data.nodes||[]).forEach(n=>visibleNodes.add(n.id));edges.forEach(e=>visibleEdges.add(e));retainedStats={nodes:visibleNodes.size,edges:visibleEdges.size};return}
      const queue=[];
      // The measured portal scaffold is a forest of anchored branches rather than
      // one root-to-terminal tree. Keep every surviving measured anchor, then
      // retain only CCO extensions connected to those anchors.
      (data.nodes||[]).filter(n=>n.scaffold&&!blocked(n.id)).forEach(n=>{visibleNodes.add(n.id);queue.push(n.id)});
      if(!queue.length)(data.nodes||[]).filter(n=>!blocked(n.id)).slice(0,1).forEach(n=>{visibleNodes.add(n.id);queue.push(n.id)});
      while(queue.length){const id=queue.shift();(adj[id]||[]).forEach(pair=>{const next=pair[0],e=pair[1];if(visibleEdges.has(e))return;visibleEdges.add(e);if(!visibleNodes.has(next)){visibleNodes.add(next);queue.push(next)}})}
      retainedStats={nodes:visibleNodes.size,edges:Array.from(visibleEdges).filter(e=>inflowEdges.has(e)||!edgeInResectedSide(e)).length};
    }
    function makeRadiusMesh(data,scaffold,material){const geo=new THREE.Geometry(),scale=+document.getElementById('radiusScale').value;const byId={};(data.nodes||[]).forEach(n=>byId[n.id]=n);allEdges(data).filter(e=>!!e.scaffold===scaffold&&!edgeRemoved(e)).forEach(e=>{const A=new THREE.Vector3(...byId[e.a].p),B=new THREE.Vector3(...byId[e.b].p),v=B.clone().sub(A),L=v.length();if(L<1e-6)return;const r=Math.max(0.06,(+e.radius||0.18)*scale);const g=new THREE.CylinderGeometry(r,r,L,6,1,false);const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize());const m=new THREE.Matrix4();m.makeRotationFromQuaternion(q);m.setPosition(A.clone().add(B).multiplyScalar(.5));geo.merge(g,m);});const mesh=new THREE.Mesh(geo,material);return mesh}
    function buildZones(data){if(zoneGroup)group.remove(zoneGroup);zoneGroup=new THREE.Group();const centers=[];data.zones.forEach((z,i)=>{const v=z.vertices, c=new THREE.Vector3();for(let j=0;j<v.length;j+=3)c.add(new THREE.Vector3(v[j],v[j+1],v[j+2]));centers.push(c.multiplyScalar(3/v.length));const g=new THREE.Geometry();for(let j=0;j<v.length;j+=3)g.vertices.push(new THREE.Vector3(v[j],v[j+1],v[j+2]));for(let j=0;j<z.faces.length;j+=3)g.faces.push(new THREE.Face3(z.faces[j],z.faces[j+1],z.faces[j+2]));g.computeVertexNormals();const m=new THREE.MeshPhongMaterial({color:[0xe41a1c,0xff7f00,0x4daf4a,0x377eb8,0x984ea3,0xa65628,0xf781bf,0x17becf][i],transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false});const mesh=new THREE.Mesh(g,m);mesh.renderOrder=4;zoneGroup.add(mesh)});group.add(zoneGroup);zoneCenters=centers;return centers}
    function assignZones(data,centers){
      nodeZone={};const byId={},adj={};(data.nodes||[]).forEach(n=>{byId[n.id]=n;adj[n.id]=[]});
      const nearest=p=>{const ds=centers.map(c=>p.distanceToSquared(c));return ds.indexOf(Math.min.apply(null,ds))+1};
      (data.nodes||[]).filter(n=>n.scaffold).forEach(n=>{nodeZone[n.id]=nearest(new THREE.Vector3(...n.p))});
      (data.edges||[]).forEach(e=>{if(adj[e.a]&&adj[e.b]){adj[e.a].push(e.b);adj[e.b].push(e.a)}});
      const q=Object.keys(nodeZone).map(Number);for(let i=0;i<q.length;i++){const id=q[i];(adj[id]||[]).forEach(next=>{if(nodeZone[next]===undefined){nodeZone[next]=nodeZone[id];q.push(next)}})}
      (data.nodes||[]).forEach(n=>{if(nodeZone[n.id]===undefined)nodeZone[n.id]=nearest(new THREE.Vector3(...n.p))});
    }
    function showTree(data){currentData=data;buildContinuityEdges(data);rebuildRetainedTopology(data);if(treeGroup)group.remove(treeGroup);if(nodesGroup)group.remove(nodesGroup);treeGroup=new THREE.Group();nodesGroup=new THREE.Group();
      const scaffoldMaterial=new THREE.MeshPhongMaterial({color:0x243b72,transparent:true,opacity:.98});
      const generatedMaterial=new THREE.MeshPhongMaterial({color:0x2aa876,transparent:true,opacity:.9});
      treeGroup.add(makeRadiusMesh(data,true,scaffoldMaterial));
      treeGroup.add(makeRadiusMesh(data,false,generatedMaterial));
      if(document.getElementById('showNodes').checked){const nodeGeometry=new THREE.Geometry();(data.nodes||[]).filter(n=>visibleNodes.has(n.id)).forEach(n=>nodeGeometry.vertices.push(new THREE.Vector3(n.p[0],n.p[1],n.p[2])));nodesGroup.add(new THREE.Points(nodeGeometry,new THREE.PointsMaterial({color:0xe67e22,size:1.2,sizeAttenuation:true})))}
      group.add(treeGroup);group.add(nodesGroup);nodesGroup.visible=document.getElementById('showNodes').checked;document.getElementById('treeOpacity').oninput=e=>{scaffoldMaterial.opacity=+e.target.value;generatedMaterial.opacity=+e.target.value;document.getElementById('treeOpacityValue').value=e.target.value};
      const s=data.summary||{},a=data.assumptions||{};document.getElementById('meta').innerHTML=`<b>${data.label||data.id||'CCO tree'}</b><br>Nodes: ${(data.nodes||[]).length} · Edges: ${(data.edges||[]).length}<br>Terminals: ${a.terminalCountFinal??'n/a'} · Flow: ${s.totalFlowMlMin??'n/a'} mL/min · Generations: ${s.maxTerminalGeneration??'n/a'}`;
      const cut=resected(),scenarioName=document.getElementById('scenario').value,remnant=scenarioName==='right'?'II-IV':'I-VIII';document.getElementById('zoneStatus').textContent=(cut.length?'Resection mask: segments '+cut.join(', ')+'. ':'Intact scenario. ')+'Remnant vessel rule: retain segments '+remnant+'. '+(scenarioName==='right'?'Segment IV vessel preservation enabled. ':'')+'Zones are exploratory portal-perfusion assignments.';document.getElementById('status').textContent='Loaded scaffold-constrained CCO tree. '+(cut.length&&document.getElementById('hideResected').checked?('Retained scaffold-connected vessels: '+retainedStats.edges+' edges; orphan components removed. Provisional portal-inflow scaffold preserved with '+virtualEdges.length+' near-coincident continuity repairs; root annotation is required for a physiological solve. '):'')+'Pending Poiseuille re-solve.';if(zoneGroup)zoneGroup.visible=document.getElementById('showZones').checked;refreshSurface();fit();
    }
    document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{showTree(JSON.parse(r.result))}catch(err){document.getElementById('status').textContent='Could not parse this JSON file.'}};r.readAsText(f)};
    document.getElementById('showNodes').onchange=e=>{if(nodesGroup)nodesGroup.visible=e.target.checked};document.getElementById('showZones').onchange=e=>{if(zoneGroup)zoneGroup.visible=e.target.checked};document.getElementById('showSurface').onchange=e=>{if(surface)surface.visible=e.target.checked};document.getElementById('radiusScale').oninput=e=>{document.getElementById('radiusScaleValue').value=e.target.value+'x';if(currentData)showTree(currentData)};document.getElementById('scenario').onchange=()=>{const active=document.getElementById('scenario').value!=='intact';document.getElementById('hideResected').checked=active;if(currentData)showTree(currentData)};document.getElementById('hideResected').onchange=()=>{if(currentData)showTree(currentData)};document.getElementById('hideResectedSurface').onchange=()=>{refreshSurface()};document.getElementById('fit').onclick=fit;document.getElementById('wire').onclick=e=>{wire=!wire;if(surfaceMaterial)surfaceMaterial.wireframe=wire;e.target.textContent=wire?'Solid surface':'Surface wireframe'};
    function surfaceResectionPlane(){if(!zoneCenters||!resected().length)return null;const cut=new Set(resected()),keep=zoneCenters.filter((c,i)=>!cut.has(i+1)),remove=zoneCenters.filter((c,i)=>cut.has(i+1));if(!keep.length||!remove.length)return null;const a=new THREE.Vector3(),b=new THREE.Vector3();keep.forEach(c=>a.add(c));remove.forEach(c=>b.add(c));a.multiplyScalar(1/keep.length);b.multiplyScalar(1/remove.length);return {point:a.add(b).multiplyScalar(.5),normal:b.sub(a).normalize()}}
    function visibleSurfaceGeometry(g){const plane=(!document.getElementById('hideResectedSurface').checked||!resected().length)?null:surfaceResectionPlane();if(!plane)return g.clone();const out=new THREE.Geometry(),map={};g.faces.forEach(f=>{const c=new THREE.Vector3().add(g.vertices[f.a]).add(g.vertices[f.b]).add(g.vertices[f.c]).multiplyScalar(1/3);if(c.clone().sub(plane.point).dot(plane.normal)>0)return;[f.a,f.b,f.c].forEach(i=>{if(map[i]===undefined){map[i]=out.vertices.length;out.vertices.push(g.vertices[i].clone())}});out.faces.push(new THREE.Face3(map[f.a],map[f.b],map[f.c]))});out.computeVertexNormals();return out}
    function refreshSurface(){if(!surface||!surfaceSource)return;surface.geometry=visibleSurfaceGeometry(surfaceSource);surface.geometry.computeBoundingBox()}
    function addSurface(g){surfaceSource=g.faces?g.clone():new THREE.Geometry().fromBufferGeometry(g);surfaceSource.computeBoundingBox();surfaceMaterial=new THREE.MeshPhongMaterial({color:0xd9a441,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false});surface=new THREE.Mesh(visibleSurfaceGeometry(surfaceSource),surfaceMaterial);group.add(surface);fit()}
    loadSTL('../cco/data/S2.stl?v=volume-fill-1').then(addSurface).catch(()=>loadGeometry('../data/libzinc-json/surface15_1.json').then(addSurface).catch(()=>{}));
    Promise.all([fetch('../data/portal_zones_volume.json?v=zones-1').then(r=>r.json()),fetch('../cco/data/cco_post_s2_terminal_fronts_murray_pruned.json?v=terminal-fronts-murray-1').then(r=>r.json())]).then(([z,d])=>{const centers=buildZones(z);assignZones(d,centers);showTree(d)}).catch(()=>{document.getElementById('status').textContent='Could not load the hepatectomy scenario assets.'});
    function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
  </script>
</body>
</html>
