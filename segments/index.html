<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal vein and exploratory Couinaud zones</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#f7f8fa}
    #view{width:100%;height:100%;display:block}
    #panel{position:fixed;top:14px;left:14px;z-index:2;width:300px;padding:14px 16px;color:#17202a;background:rgba(255,255,255,.96);border:1px solid #d6dbe1;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
    h1{font-size:16px;margin:0 0 10px}label{display:block;margin:8px 0;font-size:13px}input[type=range]{width:115px;vertical-align:middle}button{margin:5px 5px 0 0;padding:6px 9px;border:1px solid #c5ccd4;border-radius:6px;background:white;cursor:pointer}#hint,#status{margin-top:8px;font-size:11px;color:#68727c;line-height:1.35}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.segmentItem{display:inline-block;width:78px;font-size:11px;line-height:1.45}
  </style>
</head>
<body>
  <div id="panel">
    <h1>Portal vein and independent Couinaud zones</h1>
    <label><input id="showPortal" type="checkbox" checked> <span class="swatch" style="background:#2878b5"></span>Portal vein</label>
    <label><input id="showSurface" type="checkbox" checked> <span class="swatch" style="background:#d9a441"></span>Liver surface</label>
    <label><input id="showSegments" type="checkbox" checked> <span>Eight portal zones</span></label>
    <label>Liver opacity <input id="surfaceOpacity" type="range" min="0.05" max="0.55" step="0.05" value="0.12"> <output id="surfaceOpacityValue">0.12</output></label>
    <label>Zone opacity <input id="zoneOpacity" type="range" min="0.25" max="0.9" step="0.05" value="0.68"> <output id="zoneOpacityValue">0.68</output></label>
    <div id="legend"></div>
    <button id="fit">Fit view</button><button id="wire">Surface wireframe</button>
    <div id="hint">Rotate: left-drag · Pan: right-drag · Zoom: wheel/middle-drag</div>
    <div id="status">Loading portal vein and zones...</div>
  </div>
  <canvas id="view"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.84.0/examples/js/loaders/JSONLoader.js"></script>
  <script>
    const canvas=document.getElementById('view'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0xf7f8fa,1);
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,1,.1,10000), controls=new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true; controls.enablePan=true; controls.screenSpacePanning=true; controls.mouseButtons={ORBIT:THREE.MOUSE.LEFT,ZOOM:THREE.MOUSE.MIDDLE,PAN:THREE.MOUSE.RIGHT};
    scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.6)); const key=new THREE.DirectionalLight(0xffffff,1.8); key.position.set(1,2,3); scene.add(key);
    const group=new THREE.Group(); scene.add(group), loader=new THREE.JSONLoader(); let portal,surface,surfaceMaterial,zones,zoneMaterials=[],wire=false;
    const colors=[0xe41a1c,0xff7f00,0x4daf4a,0x377eb8,0x984ea3,0xa65628,0xf781bf,0x17becf], labels=['I (caudate)','II','III','IV','V','VI','VII','VIII'];
    function load(url){return new Promise((resolve,reject)=>loader.load(url,g=>resolve(g),undefined,reject));}
    function buildZones(surfaceGeometry,portalGeometry){
      const points=portalGeometry.vertices.map(v=>v.clone()), centers=[points[Math.floor(points.length/2)].clone()];
      while(centers.length<8){let best=points[0],score=-1;points.forEach(p=>{const d=Math.min.apply(null,centers.map(c=>p.distanceToSquared(c)));if(d>score){score=d;best=p}});centers.push(best.clone())}
      for(let k=0;k<8;k++){const sums=centers.map(()=>new THREE.Vector3()),counts=centers.map(()=>0);points.forEach(p=>{let j=0,d0=Infinity;centers.forEach((c,i)=>{const d=p.distanceToSquared(c);if(d<d0){d0=d;j=i}});sums[j].add(p);counts[j]++});centers.forEach((c,i)=>{if(counts[i])c.copy(sums[i]).multiplyScalar(1/counts[i])})}
      const box=surfaceGeometry.boundingBox, center=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3()), radius=size.multiplyScalar(.5), geoms=labels.map(()=>new THREE.Geometry());
      const step=4.0;
      for(let x=center.x-radius.x;x<=center.x+radius.x;x+=step) for(let y=center.y-radius.y;y<=center.y+radius.y;y+=step) for(let z=center.z-radius.z;z<=center.z+radius.z;z+=step){
        const nx=(x-center.x)/radius.x, ny=(y-center.y)/radius.y, nz=(z-center.z)/radius.z;
        if(nx*nx+ny*ny+nz*nz>0.96) continue;
        const p=new THREE.Vector3(x,y,z); let zone=0,d0=Infinity;
        centers.forEach((c,i)=>{const d=p.distanceToSquared(c);if(d<d0){d0=d;zone=i}}); geoms[zone].vertices.push(p);
      }
      zoneMaterials=colors.map(c=>new THREE.PointsMaterial({color:c,size:4.5,transparent:true,opacity:.68,sizeAttenuation:true,depthTest:true,depthWrite:false}));
      zones=new THREE.Group();geoms.forEach((g,i)=>{const cloud=new THREE.Points(g,zoneMaterials[i]);cloud.renderOrder=5;zones.add(cloud)});zones.visible=true;group.add(zones);
      document.getElementById('legend').innerHTML=labels.map((l,i)=>'<span class="segmentItem"><span class="swatch" style="background:#'+colors[i].toString(16).padStart(6,'0')+'"></span>'+l+'</span>').join('');
    }
    function fit(){const box=new THREE.Box3().setFromObject(group),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),r=Math.max(size.x,size.y,size.z)*.5||1;camera.position.copy(center).add(new THREE.Vector3(r*1.7,r*1.25,r*2.3));camera.near=Math.max(r/1000,.01);camera.far=Math.max(r*20,100);camera.updateProjectionMatrix();controls.target.copy(center);controls.update()}
    document.getElementById('showPortal').onchange=e=>portal.visible=e.target.checked; document.getElementById('showSurface').onchange=e=>surface.visible=e.target.checked; document.getElementById('showSegments').onchange=e=>zones.visible=e.target.checked;
    document.getElementById('surfaceOpacity').oninput=e=>{surfaceMaterial.opacity=+e.target.value;document.getElementById('surfaceOpacityValue').value=e.target.value}; document.getElementById('zoneOpacity').oninput=e=>{zoneMaterials.forEach(m=>m.opacity=+e.target.value);document.getElementById('zoneOpacityValue').value=e.target.value};
    document.getElementById('fit').onclick=fit; document.getElementById('wire').onclick=e=>{wire=!wire;surfaceMaterial.wireframe=wire;e.target.textContent=wire?'Solid surface':'Surface wireframe'};
    Promise.all([load('../data/libzinc-json/portal15_1.json'),load('../data/libzinc-json/surface15_1.json')]).then(gs=>{const pg=gs[0],sg=gs[1];pg.computeBoundingBox();sg.computeBoundingBox();portal=new THREE.Mesh(pg,new THREE.MeshPhongMaterial({color:0x2878b5,side:THREE.DoubleSide,shininess:70}));portal.name='Portal vein';group.add(portal);surfaceMaterial=new THREE.MeshPhongMaterial({color:0xd9a441,transparent:true,opacity:.06,side:THREE.DoubleSide,depthWrite:false});surface=new THREE.Mesh(sg,surfaceMaterial);surface.name='Liver surface reference';group.add(surface);buildZones(sg,pg);fit();document.getElementById('status').textContent='Independent 3D portal-territory field loaded. Liver surface is a faint reference only.'}).catch(e=>{console.error(e);document.getElementById('status').textContent='Load failed. Serve the repository over HTTP.'});
    function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
  </script>
</body>
</html>
